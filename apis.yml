name: Funding Circle
description: >-
  Funding Circle is a UK small-business lending marketplace providing term
  business loans, the FlexiPay revolving line of credit, a cashback business
  credit card, government-backed Growth Guarantee Scheme loans, and asset
  finance. For partners and brokers it publishes the Funding Circle Introducer
  API, which lets platforms submit and manage business loan applications
  programmatically: create term or FlexiPay applications, poll application
  status, retrieve credit decisions, and upload supporting documents. The API
  uses OAuth 2.0 client-credentials authentication, RFC 7807 problem-detail
  errors, callback-URL webhooks, and a sandbox environment with documented test
  values.
